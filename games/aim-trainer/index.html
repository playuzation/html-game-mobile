<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>Aim Trainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden; background: #0d1b2a; color: #fff;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    }
    #view { position: fixed; inset: 0; display: block; cursor: crosshair; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2;
      padding: calc(env(safe-area-inset-top) + 8px) 10px 8px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; background: rgba(8,16,26,.85);
    }
    .btn {
      height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 13px; font-weight: 700;
      display: grid; place-items: center; text-decoration: none; cursor: pointer;
    }
    .btn[hidden] { display: none; }
    .stats { display: flex; justify-content: center; gap: 14px; text-align: center; }
    .stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat span { font-size: 10px; opacity: .7; }
    #score { color: #69f0ae; }
    #score.neg { color: #ff5252; }
    #detail { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 62px);
      font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.4); white-space: nowrap; }
    #coach, #lockhint {
      position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 520px;
      padding: 10px 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 700; pointer-events: none;
    }
    #coach { top: calc(env(safe-area-inset-top) + 96px); background: rgba(41,121,255,.85); }
    #lockhint { bottom: calc(env(safe-area-inset-bottom) + 20px); background: rgba(0,0,0,.55); font-weight: 600; }
    #coach[hidden], #lockhint[hidden] { display: none; }
    #fire {
      position: fixed; z-index: 3; right: 22px; bottom: calc(env(safe-area-inset-bottom) + 28px);
      width: 96px; height: 96px; border-radius: 50%; border: 4px solid rgba(255,255,255,.7); background: rgba(229,57,53,.75);
      color: #fff; font: inherit; font-size: 18px; font-weight: 900; touch-action: none; box-shadow: 0 6px 16px rgba(0,0,0,.4);
    }
    #fire.on { transform: scale(.92); background: rgba(255,82,82,.95); }
    @media (pointer: fine) { #fire { display: none; } }
    .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(5,10,18,.85); padding: 16px; }
    .modal[hidden] { display: none; }
    .panel { width: 100%; max-width: 400px; text-align: center; }
    .panel h1 { font-size: 28px; font-weight: 900; }
    .sub { opacity: .8; font-size: 14px; line-height: 1.7; margin-top: 8px; }
    .go { margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #2979ff; color: #fff; font-size: 17px; font-weight: 900; cursor: pointer; }
    .go.alt { background: rgba(255,255,255,.12); }
    .link { display: block; margin-top: 12px; color: #82b1ff; font-weight: 800; text-decoration: none; }
    .sens { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .sens input { flex: 1; accent-color: #2979ff; }
    #res-score { font-size: 64px; font-weight: 900; color: #69f0ae; }
    table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.1); }
    th { text-align: left; font-weight: 600; opacity: .8; }
    td { text-align: right; font-weight: 800; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>

  <header id="hud">
    <a class="btn" href="../../" aria-label="타이틀로">←</a>
    <div class="stats">
      <div class="stat"><b id="score">-</b><span>점수</span></div>
      <div class="stat"><b id="time">0:00.0</b><span>플레이 시간</span></div>
      <div class="stat"><b id="avg">-</b><span>과녁당 평균</span></div>
    </div>
    <button id="stop" class="btn" type="button" hidden>종료</button>
  </header>
  <div id="detail"></div>
  <div id="coach" hidden></div>
  <div id="lockhint" hidden>🖱️ 화면을 클릭하면 마우스로 조준합니다 (Esc 로 해제) · Space/클릭 = 사격</div>
  <button id="fire" type="button" aria-label="사격">FIRE</button>

  <div id="intro" class="modal">
    <div class="panel">
      <div style="font-size:56px">🎯</div>
      <h1>AIM TRAINER</h1>
      <p class="sub">화면 가운데 조준선은 고정, <b>시점을 돌려</b> 과녁을 맞추는 FPS 사격 연습.<br>
        과녁은 최대 4개가 무작위 위치에 나타납니다.<br>명중 <b style="color:#69f0ae">+1</b> · 빗나감 <b style="color:#ff5252">-1</b></p>
      <p class="sub" id="best"></p>
      <div class="sens"><span>감도</span><input id="sens" type="range" min="0.3" max="2.5" step="0.1"><b id="sens-val"></b></div>
      <button id="tutorial" class="go" type="button">튜토리얼부터 시작</button>
      <button id="skip" class="go alt" type="button">바로 연습 시작</button>
      <a class="link" href="../../">타이틀로</a>
    </div>
  </div>

  <div id="end" class="modal" hidden>
    <div class="panel">
      <p class="sub">최종 점수</p>
      <div id="res-score"></div>
      <table><tbody id="res-rows"></tbody></table>
      <p class="sub" id="res-best"></p>
      <button id="again" class="go" type="button">다시 연습</button>
      <a class="link" href="../../">타이틀로</a>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
