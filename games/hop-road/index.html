<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd765">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hop Road</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden; background: #2b2f36;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    }
    #wrap { position: relative; height: 100dvh; max-width: 520px; margin: 0 auto; }
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud {
      position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start;
      color: #fff; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.35); pointer-events: none;
    }
    #score { font-size: 44px; line-height: 1; }
    #best { font-size: 16px; opacity: .9; margin-top: 6px; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: #fff; text-align: center;
      text-shadow: 0 2px 0 rgba(0,0,0,.35);
    }
    .overlay[hidden] { display: none; }
    #start { pointer-events: none; justify-content: flex-start; padding-top: 24vh; }
    #start h1 { font-size: 40px; letter-spacing: 1px; }
    #start p { font-size: 16px; line-height: 1.6; opacity: .95; }
    #over { background: rgba(0,0,0,.45); }
    #over h2 { font-size: 28px; }
    #final { font-size: 64px; font-weight: 900; }
    #retry {
      margin-top: 8px; padding: 14px 40px; border: 0; border-radius: 14px;
      background: #ffb627; color: #3a2a00; font-size: 20px; font-weight: 800;
      box-shadow: 0 5px 0 #c98a00; touch-action: manipulation; cursor: pointer;
    }
    #retry:active { transform: translateY(3px); box-shadow: 0 2px 0 #c98a00; }
    #share {
      position: fixed; right: 20px; bottom: 20px; width: 220px; padding: 16px;
      background: #fff; color: #222; border-radius: 14px; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: 13px; line-height: 1.5;
    }
    #share[hidden] { display: none; }
    #share img { width: 180px; height: 180px; display: block; margin: 8px auto; }
    #share a { color: #2563eb; word-break: break-all; }
    @media (max-width: 860px) { #share { display: none; } }
    #home {
      position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
      padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.25);
      color: #fff; font-size: 13px; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div class="hud"><div id="score">0</div><div id="best">BEST 0</div></div>
    <a id="home" href="../../">← 타이틀</a>
    <div id="start" class="overlay">
      <h1>HOP ROAD</h1>
      <p>탭 = 앞으로 · 스와이프 = 방향 이동<br>차를 피하고 통나무를 타세요!</p>
    </div>
    <div id="over" class="overlay" hidden>
      <h2>GAME OVER</h2>
      <div id="final">0</div>
      <button id="retry" type="button">다시하기</button>
    </div>
  </div>
  <aside id="share" hidden>
    <strong>📱 휴대폰으로 플레이</strong><br>카메라로 QR을 스캔하세요
    <img id="qr" alt="이 페이지 QR 코드">
    <a id="share-url" target="_blank" rel="noopener"></a>
  </aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
