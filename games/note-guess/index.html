<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <title>Note Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh; display: flex; flex-direction: column; gap: 10px; color: #fff;
      background: radial-gradient(circle at 50% 0%, #26304a, #14181f 70%);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
      padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 12px);
    }
    button { font: inherit; cursor: pointer; }
    body > * { flex-shrink: 0; } /* 화면보다 길면 줄이지 말고 스크롤 */
    .bar { display: flex; align-items: center; gap: 8px; }
    .btn {
      height: 34px; min-width: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.1); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; text-decoration: none;
    }
    .bar h1 { flex: 1; text-align: center; font-size: 17px; font-weight: 900; }
    .settings { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    #levels { display: flex; gap: 4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 12px; }
    #levels button { padding: 7px 14px; border: 0; border-radius: 9px; background: none; color: #cfd8dc; font-weight: 800; }
    #levels button.on { background: #7c4dff; color: #fff; }
    #range { font-size: 12px; opacity: .7; }
    .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .switch input { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.2); position: relative; cursor: pointer; transition: background .2s; }
    .switch input::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
    .switch input:checked { background: #00c853; }
    .switch input:checked::after { left: 21px; }

    #modes { display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.08); }
    #modes button { flex: 1 0 auto; padding: 7px 10px; border: 0; border-radius: 9px; background: none; color: #cfd8dc; font-weight: 800; font-size: 13px; white-space: nowrap; }
    #modes button.on { background: #00897b; color: #fff; }
    .listen { display: flex; align-items: center; gap: 14px; }
    #arp { padding: 10px 14px; border: 0; border-radius: 12px; background: rgba(255,255,255,.12); color: #fff; font-weight: 800; }
    #arp[hidden] { display: none; }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #replay {
      width: 120px; height: 120px; border-radius: 50%; border: 0; color: #fff; font-size: 15px; font-weight: 900;
      background: radial-gradient(circle at 35% 30%, #9575ff, #5e35b1); box-shadow: 0 8px 0 #311b92, 0 14px 24px rgba(0,0,0,.4);
    }
    #replay span { display: block; font-size: 44px; line-height: 1.1; }
    #replay:active { transform: translateY(4px); box-shadow: 0 4px 0 #311b92; }
    #replay.ping { animation: ping .5s; }
    @keyframes ping { 0% { box-shadow: 0 8px 0 #311b92, 0 0 0 0 rgba(149,117,255,.7); } 100% { box-shadow: 0 8px 0 #311b92, 0 0 0 26px rgba(149,117,255,0); } }
    .ans { font-size: 13px; opacity: .8; }
    #answer { font-size: 22px; font-weight: 900; color: #ffd54a; margin-left: 4px; }
    #feedback { min-height: 24px; font-size: 16px; font-weight: 800; text-align: center; }
    #feedback.up { color: #ff8a65; }
    #feedback.down { color: #4fc3f7; }
    #feedback.ok { color: #69f0ae; }
    #feedback.no { color: #ff8a80; }

    #pads { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .pad {
      position: relative; height: 72px; border-radius: 12px; border: 0; background: #eceff1; color: #263238;
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 0 #90a4ae;
    }
    .pad b { font-size: 20px; }
    .pad small { font-size: 10px; opacity: .7; }
    .pad.sharp { background: #37474f; color: #fff; box-shadow: 0 4px 0 #1c262b; }
    .pad:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #90a4ae; }
    .pad:disabled { opacity: .35; cursor: default; box-shadow: none; transform: translateY(3px); }
    .pad.wrong { background: #5d4037; color: #ffccbc; }
    .pad.wrong:disabled { opacity: .7; }
    .pad.right { opacity: 1; background: #00c853; color: #fff; box-shadow: 0 0 0 3px #b9f6ca; }
    .pad .hint { position: absolute; bottom: 3px; font-style: normal; font-size: 10px; font-weight: 900; color: #ffd54a; }
    body.nohint .pad .hint { display: none; }
    .order { display: flex; justify-content: space-between; font-size: 11px; opacity: .55; margin-top: -4px; }

    #next {
      width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #2979ff; color: #fff; font-size: 17px; font-weight: 900;
      box-shadow: 0 4px 0 #1c54b2;
    }
    #next[hidden] { display: none; }
    .stats { display: flex; justify-content: space-around; font-size: 12px; opacity: .85; text-align: center; }
    .stats b { display: block; font-size: 16px; }
    #piano { width: 100%; height: auto; }
    #piano .k.w { fill: #fafafa; stroke: #90a4ae; stroke-width: .4; }
    #piano .k.b { fill: #263238; }
    #piano .k.out.w { fill: #607d8b; }
    #piano .k.out.b { fill: #37474f; }
    #piano .k.ans { fill: #00e676; }
    #piano .lbl { font-size: 6px; fill: #b0bec5; text-anchor: middle; }
    .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(10,12,20,.88); padding: 16px; }
    .modal[hidden] { display: none; }
    .panel { width: 100%; max-width: 400px; text-align: center; }
    .panel h2 { font-size: 28px; font-weight: 900; }
    .sub { opacity: .85; font-size: 14px; line-height: 1.7; margin-top: 8px; }
    .go { margin-top: 16px; width: 100%; padding: 15px; border: 0; border-radius: 14px; background: #7c4dff; color: #fff; font-size: 18px; font-weight: 900; }
    .link { display: block; margin-top: 12px; color: #b39ddb; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="btn" href="../../" aria-label="타이틀로">←</a>
    <h1>🎹 음 맞히기</h1>
    <span class="btn" style="visibility:hidden">←</span>
  </div>

  <div class="settings">
    <div>
      <div id="levels"><button type="button" data-lv="easy">하</button><button type="button" data-lv="normal">중</button><button type="button" data-lv="hard">상</button></div>
      <div id="range"></div>
    </div>
    <label class="switch">UP/DOWN 힌트 <input id="hints" type="checkbox"></label>
  </div>
  <div id="modes" aria-label="모드">
    <button type="button" data-mode="single">근음</button>
    <button type="button" data-mode="maj">메이저</button>
    <button type="button" data-mode="min">마이너</button>
    <button type="button" data-mode="maj7">메이저 세븐</button>
    <button type="button" data-mode="dom7">도미넌트 세븐</button>
  </div>

  <div class="stage">
    <div class="listen">
      <button id="replay" type="button" aria-label="다시 듣기"><span>🔊</span>다시 듣기</button>
      <button id="arp" type="button" hidden>🎼 펼쳐 듣기</button>
    </div>
    <div class="ans">정답 건반<span id="answer">?</span></div>
    <div id="feedback"></div>
  </div>

  <div id="pads"></div>
  <div class="order"><span>◀ 낮음 (C)</span><span>높음 (B) ▶</span></div>
  <button id="next" type="button" hidden>다음 문제 ▶</button>

  <div class="stats">
    <div><b id="stat-solved">0</b>맞힌 문제</div>
    <div><b id="stat-acc">-</b>한 번에 맞힘</div>
    <div><b id="stat-streak">0</b>연속</div>
  </div>
  <svg id="piano" aria-label="88건반 (회색은 출제 범위 밖)"></svg>

  <div id="intro" class="modal">
    <div class="panel">
      <div style="font-size:56px">🎹👂</div>
      <h2>음 맞히기</h2>
      <p class="sub">피아노 88건반 중 한 음이 <b>사각파</b> 소리로 울려요.<br>
        <b>C ~ B 12개 버튼</b> 중 어떤 음인지 맞혀 보세요.<br>
        틀린 버튼은 꺼지고, 힌트가 켜져 있으면 <b>UP / DOWN</b> 으로 알려 줘요<br>
        (C 가 가장 낮고 B 가 가장 높은 기준).<br>
        화음 모드에서는 울린 화음의 <b>구성음을 모두</b> 찾으세요.</p>
      <p class="sub" style="font-size:12px;opacity:.6">🔊 소리를 켜 주세요 (아이폰은 무음 스위치도 확인)</p>
      <button id="start" class="go" type="button">시작</button>
      <a class="link" href="../../">타이틀로</a>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
