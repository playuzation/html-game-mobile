<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1b33">
  <title>Mini Game Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh; background: radial-gradient(circle at 50% -10%, #3b3577, #1d1b33 60%);
      color: #fff; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
    }
    main { max-width: 520px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header .logo { font-size: 48px; }
    header h1 { font-size: 30px; font-weight: 900; letter-spacing: 1px; margin-top: 6px; }
    header p { opacity: .7; margin-top: 6px; font-size: 14px; }
    #list { display: flex; flex-direction: column; gap: 14px; }
    .card {
      display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px;
      background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.08);
      color: inherit; text-decoration: none; transition: transform .12s, border-color .12s;
    }
    .card:active { transform: scale(.98); }
    .card:hover { border-color: var(--accent); }
    .icon {
      flex: none; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
      font-size: 36px; background: var(--accent); box-shadow: 0 4px 0 rgba(0,0,0,.3);
    }
    .body { flex: 1; min-width: 0; }
    .body h2 { font-size: 19px; font-weight: 800; }
    .body p { font-size: 13px; opacity: .8; margin-top: 4px; line-height: 1.45; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tags span { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.12); }
    .go { flex: none; font-size: 18px; color: var(--accent); }
    footer { text-align: center; opacity: .5; font-size: 12px; margin-top: 28px; }
    #share {
      position: fixed; right: 20px; bottom: 20px; width: 220px; padding: 16px;
      background: #fff; color: #222; border-radius: 14px; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: 13px; line-height: 1.5;
    }
    #share[hidden] { display: none; }
    #share img { width: 180px; height: 180px; display: block; margin: 8px auto; }
    #share a { color: #2563eb; word-break: break-all; }
    @media (max-width: 860px) { #share { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo">🕹️</div>
      <h1>MINI ARCADE</h1>
      <p>플레이할 게임을 고르세요 · <span id="count">0</span>개</p>
    </header>
    <nav id="list"></nav>
    <footer>새 게임은 계속 추가됩니다</footer>
  </main>
  <aside id="share" hidden>
    <strong>📱 휴대폰으로 플레이</strong><br>카메라로 QR을 스캔하세요
    <img id="qr" alt="이 페이지 QR 코드">
    <a id="share-url" target="_blank" rel="noopener"></a>
  </aside>
  <script type="module" src="title.js"></script>
</body>
</html>
